plugins {
    id 'java'
}

group = 'com.vit.demo'
version = '1.0.0'

// Updated for Gradle 9+ compatibility
java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.vit.demo.App'
    }
}

test {
    testLogging {
        // Ensures you can see the TEST PASSED string in standard output
        events "passed", "failed", "standardOut", "standardError"
    }
}